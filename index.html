<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07594f">
  <title>Graces Digital | Card 007</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icon Preto" type="image/svg+xml">
</head>
<body>
  <div class="ambient ambient--teal"></div>
  <div class="ambient ambient--mint"></div>

  <main class="card">
    <div class="cross-pattern" aria-hidden="true">
      <span class="cross cross--one"></span>
      <span class="cross cross--two"></span>
      <span class="cross cross--three"></span>
    </div>
    <div class="top-shine" aria-hidden="true"></div>

    <section class="profile">
      <div class="portrait-wrap">
        <span class="portrait-halo"></span>
        <img class="portrait" src="assets/perfil.png" alt="Foto da cirurgiã-dentista">
      </div>

      <div class="brand">
        <div class="brand__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M24 7c-5-4-12-3-15 2-4 6-1 15 2 23 2 6 4 10 7 10 3 0 3-10 6-10s3 10 6 10c3 0 5-4 7-10 1-3 2-6 3-9"/><path d="M29 10c5-4 11-2 13 2 3 5 0 10-4 13-4 3-9 3-13 0"/><path d="M28 13c4 3 8 4 12 3"/></svg>
        </div>
        <div class="brand__text">
          <p><strong>G</strong>races</p>
          <p><strong>D</strong>igital</p>
        </div>
      </div>

      <p class="profession">CIRURGIÃ-DENTISTA</p>
      <span class="profile-divider"></span>
    </section>

    <nav class="actions" aria-label="Links da profissional">
      <a class="action" href="https://SEU-LINK-DE-AGENDAMENTO.com" target="_blank" rel="noopener noreferrer">
        <span>Agendamento</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4M17 2v4M3 9h18M8 14l2.5 2.5L16 11"/></svg>
      </a>
      <a class="action" href="https://maps.google.com/?q=SEU-ENDERECO" target="_blank" rel="noopener noreferrer">
        <span>Localização</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      </a>
      <a class="action" href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer">
        <span>Contato</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20.5l1.5-5.1A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8.3 8.3c.3-.4.7-.5 1-.1l1 1.6c.2.4-.1.7-.5 1.1 1 1.9 2 2.7 3.8 3.5.4-.4.8-.7 1.2-.5l1.6.9"/></svg>
      </a>
      <a class="action" href="https://SEU-SITE.com" target="_blank" rel="noopener noreferrer">
        <span>Site</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20M4.5 5.5h15M4.5 18.5h15"/></svg>
      </a>
    </nav>

    <p class="instruction">TOQUE NOS BOTÕES PARA INTERAGIR</p>
    <footer><span></span>  <span></span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
